id: s1-shop-protocol-test
title: ShopProtocolApiSync_Test 写回文档 eval
repo: client

test_file: Assets/Scripts/Network/NetModels/ShopProtocolApiSync_Test.cs

central_repo: ../game-api-sync

forbid_sync: true

run_files:
  商店: shop.json
  网络相关: network.json

golden_files:
  商店: shop.api_docs.json
  网络相关: network.type_constraints.json

modules:
  - name: 商店
    expected_targets:
      - api_docs
    expected_in_glob: false
    notes: >
      该文件不在商店 client_glob；Agent 应发现 missing_from_glob 并提醒或 --apply-glob。

  - name: 网络相关
    expected_targets:
      - type_constraints
    expected_in_glob: true
    notes: >
      由 Assets/Scripts/Network/**/*.cs 命中；draft 应含 enum/interface，不含 class 消息。

expected_symbols:
  商店:
    api_docs:
      include:
        - ShopTestPurchaseRequest
      exclude:
        - ShopTestShelfKind
  网络相关:
    type_constraints:
      include:
        - ShopTestShelfKind
        - IShopTestPriceResolver
      exclude:
        - ShopTestPurchaseRequest
